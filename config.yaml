# ============================================================
#  رصد: الإعدادات
#  المفاتيح السرية (تلغرام وناسا) توضع في GitHub Secrets لا هنا.
# ============================================================

app_name: "رصد"
app_url: ""          # رابط التطبيق بعد نشره، يضاف تلقائياً في GitHub
watermark: ""        # العلامة المائية على المقاطع (اسم قناتك مثلاً)
watermark_logo: "assets/logo.png"   # شعار القناة (شفاف ومتحرك) على صورة الحرارة

local_time:
  offset_hours: 3
  name: "بغداد"

# المناطق المراقبة. لإيقاف منطقة اكتب enabled: false
# bbox = [غرب, جنوب, شرق, شمال] بالدرجات
regions:
  - {id: hormuz,  name: "مضيق هرمز",                bbox: [55.4, 25.3, 57.6, 27.3]}
  - {id: gulf,    name: "الخليج الفارسي",           bbox: [47.8, 23.5, 56.6, 30.5]}
  - {id: saudi,   name: "السعودية",                 bbox: [34.4, 16.3, 55.7, 32.2]}
  - {id: uae,     name: "الإمارات",                 bbox: [51.5, 22.6, 56.4, 26.1]}
  - {id: qatar,   name: "قطر",                      bbox: [50.7, 24.4, 51.7, 26.2]}
  - {id: bahrain, name: "البحرين",                  bbox: [50.3, 25.5, 50.9, 26.4]}
  - {id: kuwait,  name: "الكويت",                   bbox: [46.5, 28.5, 48.5, 30.1]}
  - {id: oman,    name: "عُمان",                     bbox: [51.9, 16.6, 60.0, 26.5]}
  - {id: iraq,    name: "العراق",                   bbox: [38.7, 29.0, 48.8, 37.4]}
  - {id: red_sea, name: "البحر الأحمر وباب المندب", bbox: [32.0, 12.0, 44.5, 30.0]}

# متى يرسل تنبيهاً إلى تلغرام
alerts:
  min_verdict: "مرجّح"   # أقل حكم يستحق التنبيه: مؤكد / مرجّح / يحتاج تأكيداً
  at_facility_km: 2        # حريق داخل منشأة طاقة أو على بعد هذه المسافة منها = مهم
  near_facility_km: 10     # وعلى بعد أكبر حتى هذه المسافة: مهم فقط إذا كان قوياً (السطر التالي)
  near_facility_min_mw: 50
  big_fire_mw: 50          # أي حريق بهذه الشدة (ميغاواط) مهم حتى لو بعيداً عن المنشآت
  max_age_hours: 8         # رصدة أقدم من هذا تظهر في التطبيق ولا تُرسل كخبر
  intensity_ratio: 1.5     # تحديث عند زيادة القمة 50% على الأقل منذ آخر تنبيه
  intensity_add_mw: 1      # وبزيادة ميغاواط واحد على الأقل حتى لا تضيع زيادات الحرائق البحرية الصغيرة
  intensity_interval_min: 30  # أقل فاصل بين التنبيهات المتتالية للشدة
  intensity_max_age_hours: 24  # تحديث للحوادث المرسلة فقط؛ القياسات الأقدم من 8 ساعات تُوسم كتحديث متأخر
  # الحرائق الكبيرة البعيدة عن المنشآت تُعدّ مهمة فقط في هذه الدول
  focus_countries: [العراق, السعودية, الإمارات, قطر, البحرين, الكويت, عمان, عُمان, إيران, اليمن]
                           # الحرائق في البحر وفي الموانئ مهمة دائماً
  # حريق مؤكد في مكان لم تُرصد فيه حرارة ولا حوله خلال شهر، في دول الخليج الجافة: يُنبَّه عنه حتى لو لم تكن
  # فيه منشأة مسجّلة في الخريطة (الصحراء لا تحترق وحدها: قد يكون محطة ضخ أو بئراً أو خط أنابيب غير مرسوم).
  # دول الحرق الزراعي الموسمي (العراق، إيران...) خارج هذه القاعدة.
  new_heat_countries: [السعودية, الإمارات, قطر, البحرين, الكويت, عمان, عُمان]
  new_heat_min_mw: 5         # أضعف من هذا لا يُحسب
  new_heat_min_pictures: 4   # يستمر 4 صور متتالية (نحو 40 دقيقة)...
  new_heat_strong_mw: 20     # ...أو يبلغ هذه الشدة
  # ومنذ 24 تشرين الثاني: الحريق المؤكد في هذه الدول يُنشر أينما كان إذا حمل علامة تستحق الانتباه («نقطة نادراً ما
  # تشتعل» في الموقع، أو «بدأت فجأة وبقوة»). لا حدّ أدنى غير حدّ العلامة نفسها (5 MW)، حتى لا يفوت حريق صغير
  # مثل حريق محطة الكهرباء في جيزان (نحو 7 MW).
  sign_alerts: true
  sign_min_mw: 5
  # ومنذ 16 تشرين الثاني: حرارة عادت إلى مكان هادئ منذ أسبوع على الأقل واستمرت 6 ساعات (12 صورة)، أو 3 ساعات
  # حيث تصنّف NOAA المكان موقع نفط وغاز (مثل شمال بقيق، 15 تشرين الثاني). تُكتب «حرارة جديدة مستمرة»، بلا سبب.
  new_heat_sustained: true
  # بكسلات ناسا النهارية على ألواح محطة طاقة شمسية مرسومة، وصور Meteosat باردة في الوقت نفسه: انعكاس شمس لا حريق،
  # لا يُنشر (منشور «حريق جديد في الإمارات» يوم 11 تشرين الثاني كان كذلك على الأرجح).
  solar_glint_stop: true

# رصدات قمرَي ناسا NOAA-20 وNOAA-21 من ملفات NOAA المباشرة (مجانية، بلا حساب): الرصدات نفسها التي تصل
# عبر ناسا (FIRMS)، لكن بعد نحو 25 دقيقة من مرور القمر نهاراً و45 ليلاً بدل نحو 3 ساعات. لا تُحسب مرتين.
noaa:
  enabled: true

# منشآت تُضاف يدوياً إلى خريطة المنشآت: مواقع تعرفها أنت، أو تعرفها الخريطة المفتوحة ولم تدخل خريطة الأداة بعد.
# تُحسب فوراً دون انتظار إعادة بناء الخريطة. الفئة (category) تُكتب كما تظهر في التنبيه.
geodata:
  extra_facilities:
    # محطة ضخ على خط الأنابيب شرق–غرب، 28 كم جنوب جودة: حريق 15 تشرين الثاني 2026 رُصد وأُكّد ولم يُنبَّه عنه
    - {lat: 25.61143, lon: 48.88608, name: "محطة ضخ أرامكو السعودية 1", category: "محطة ضخ نفط وغاز", code: pumping}

# ذاكرة الحرارة المعتادة (شعلات الغاز والمصانع)
memory:
  persistent_min_days: 2   # مكان ظهرت فيه حرارة يومين أو أكثر خلال الشهر = معتاد
  window_days: 30
  unusual_ratio: 5         # شعلة منشأة معتادة صارت أقوى من عادتها 5 أضعاف (وبزيادة 25 ميغاواط على الأقل)
  unusual_add_mw: 25       # تصنّف حرارة غير معتادة وتخضع لشروط التأكيد قبل التنبيه
  unusual_record_ratio: 2  # ...وبشرط أن تتجاوز ضعف «عادة» المنشأة نفسها: مستوى بلغته في يومين مختلفين على
                           # الأقل خلال الشهر (اليوم نفسه لا يُحسب، حتى لا يُسكت حريقٌ يكبر نفسَه).
                           # المنشآت نفسها تبلغ المستوى نفسه كل بضعة أيام، وهذا عملها المعتاد لا حريق
  unusual_repeat_days: 3   # الحدث الواحد يُنشر مرة: لا يتكرر النشر للمنشأة نفسها خلال هذه الأيام
  unusual_repeat_ratio: 1.5  # ...إلا إذا بلغت الشدة مرة ونصفاً مما نُشر

# صورة «قبل وبعد» من القمر الأوروبي Sentinel-2 (كل نقطة 10 أمتار): تُرسل رداً على تنبيه الحريق
# عند أول مرور صافٍ للقمر فوق الموقع بعد الحريق (يمر كل يومين إلى خمسة أيام)
satpic:
  enabled: true
  max_days: 12      # ينتظر مروراً صافياً حتى هذا العدد من الأيام بعد آخر رصد ثم يتوقف
  half_km: 2        # الصورة تغطي 4 كم حول الموقع (6 كم إذا كان الموقع تقريبياً)

# مواقع تُراقَب دائماً حتى بلا حريق (مطارات، قواعد، موانئ، منشآت): مع كل مرور صافٍ جديد للقمر
# Sentinel-2 تُقارن الصورة بسابقتها، وتُرسل المقارنة إلى القناة فقط إذا ظهرت بقعة تغيّر واضحة.
# أضف المواقع هكذا (الاسم والإحداثيات، و half_km اختياري: نصف عرض الصورة بالكيلومتر):
#   places:
#     - {name: "مطار البصرة الدولي", lat: 30.549, lon: 47.662, half_km: 3}
watch:
  enabled: true
  min_patch_ha: 0.5   # أصغر بقعة تغيّر متصلة تستحق الإرسال (هكتار = 100×100 متر)
  places: []

clip:
  frames: 8
  half_size_km: 20   # تُقرأ الصور وتُفحص على 40 كم حول الحريق
  view_zoom: 2       # ويُعرض الفيديو أقرب مرتين، والحريق في وسطه: نحو 20 كم
  hud_title: "ALFAQAAR FIRMS"   # اسم القناة في أعلى يسار المقطع (بجانب الشعار)
  format: mp4

# استرجاع محدود للرصد الفائت. لا يرسل الحوادث المسترجعة كأخبار جديدة إلى تلغرام.
recovery:
  enabled: true
  budget_s: 15
  max_images_per_run: 2
  auto_targets: true
  targets:
    # نافذة راجعناها في منتج الحرائق الرسمي؛ يعيد تحميل الأدلة ولا ينشئ رصداً من الوصف.
    - {id: abqaiq_20261108, lat: 25.9239, lon: 49.6935, start: "2026-11-08T01:20:00Z", end: "2026-11-08T02:40:00Z", layer: mtg_frp}

# تصحيح هادئ لسجل راجعناه من ملفات ناسا الأصلية، دون تنبيهات جديدة أو تعديل رسائل سابقة.
repairs:
  enabled: true
  cases: [hormuz_20261108]

# كاشف رصد الخاص: بقع حرارة جديدة في البحر كل 10 دقائق من صور Meteosat-12
# منذ 15 نوفمبر 2026 يقرأ الصورة بكامل تفصيلها (0.25 كم للبكسل): الخادم يموّه الصورة ويؤخرها
# عشر دقائق إذا طُلبت أخشن من ذلك، فكانت حرائق السفن الصغيرة تذوب فيها. ويبحث عن وهج اللهب
# في القناتين القصيرتين، ويرفض البقع حول غيوم متحركة أو في هالة شعلة كبيرة.
# الأرقام في rasad/engine.py (DEFAULTS → seawatch)، والقياسات في docs/reviews/hormuz_ras_al_khaimah_20261114.md
# البحار المراقبة ليلاً (القائمة في engine.py → seawatch.boxes): مضيق هرمز وبحر عُمان، جنوب الخليج
# وشماله، البحر الأحمر كله من السويس إلى باب المندب، وبحر العرب قبالة عُمان.
seawatch:
  # البحار التي تُقرأ أولاً في كل فحص، كل صورة لها دون تخطٍّ: مضيق هرمز والخليج الفارسي كله
  priority_boxes: [hormuz_oman, gulf_south, gulf_north]
  enabled: true     # اختُبر على صور حقيقية لليالي 1 و9 و11 و13 و14 نوفمبر 2026
  delay_min: 0      # نفحص أحدث موعد الآن؛ الصورة غير المتاحة أو المستبدلة تبقى للمحاولة التالية
  platform_km: 3    # نستبعد الحرارة الملاصقة للمنصة، لا بقعة مستقلة تبعد عنها نحو 9 كم
  known_heat_min_days: 3 # الذاكرة تستبعد مصدراً محلياً متكرراً، لا رصدة قديمة وحيدة قربه
  known_heat_exclusion_km: 3
  prefetch:
    enabled: true # استكمال صور المقارنة في الخلفية بين دورات الفحص
    budget_s: 90
    request_timeout_s: 40
    batch_size: 8   # الصورة المفصّلة تُجلب مربعات (4 لكل مربع بحر في كل موعد)
  look_back: true   # حين ترصد ناسا حريقاً في البحر يبحث في صور Meteosat-12 عن وقت بدايته الحقيقي
  sparkle_min_days: 3  # رصدة قديمة واحدة لا تجعل الموقع شعلة معتادة (بين المنصات؛ في المياه المفتوحة 7 ليالٍ من 14)
  alerts: true      # تنبيه «مرجّح» بعد ظهور البقعة في صورتين؛ التنبيه الأولي أدناه لا ينتظر الثانية
  early_alerts:
    enabled: true   # إرسال البقعة البحرية الليلية فوراً بعنوان «رصد حراري أولي» إذا كانت صارخة
    strong_only: true   # صارخة = ارتفاع قوي مع وهج لهب؛ الأضعف تنتظر الصورة الثانية (10 دقائق)
    platform_min_rise: 30   # في حقول المنصات التي يعرف سجل ناسا شعلاتها: صورة واحدة تُرسل فقط إن كان الارتفاع 30 أو أكثر
    max_age_min: 45 # لا نعيد نشر الرصد القديم كخبر جديد بعد تركيب التحديث
    max_new_per_run: 3
    video_max_age_hours: 24 # تجهيز فيديو للسجل المنشور حتى لو تجاوز مهلة التنبيه الجديد
  daytime:
    enabled: true  # فحص نهاري تجريبي مع حجب لمعان الشمس وانعكاساتها وتغيّر الغيوم
    ref_minutes: [30, 60]  # يلزم المرجعان وصورتان مستقلتان للبقعة
    # تظهر البقعة للمراجعة؛ لا تُرسل إلى تلغرام حتى تؤكدها ناسا بثقة مناسبة أو منتج حرائق رسمي
    # الصور المعروضة لا توفر حرارة معايرة: لا نحول سطوعها إلى ميغاواط أو درجات كلفن
