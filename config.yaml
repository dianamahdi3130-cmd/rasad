# ============================================================
#  رصد: الإعدادات
#  المفاتيح السرية (تلغرام وناسا) توضع في GitHub Secrets لا هنا.
# ============================================================

app_name: "رصد"
app_url: ""          # رابط التطبيق بعد نشره، يضاف تلقائياً في GitHub
watermark: ""        # العلامة المائية على المقاطع (اسم قناتك مثلاً)
watermark_logo: "assets/logo.png"   # شعار القناة (شفاف ومتحرك) على صورة الحرارة

local_time:
  offset_hours: 3
  name: "بغداد"

# المناطق المراقبة. لإيقاف منطقة اكتب enabled: false
# bbox = [غرب, جنوب, شرق, شمال] بالدرجات
regions:
  - {id: hormuz,  name: "مضيق هرمز",                bbox: [55.4, 25.3, 57.6, 27.3]}
  - {id: gulf,    name: "الخليج الفارسي",           bbox: [47.8, 23.5, 56.6, 30.5]}
  - {id: saudi,   name: "السعودية",                 bbox: [34.4, 16.3, 55.7, 32.2]}
  - {id: uae,     name: "الإمارات",                 bbox: [51.5, 22.6, 56.4, 26.1]}
  - {id: qatar,   name: "قطر",                      bbox: [50.7, 24.4, 51.7, 26.2]}
  - {id: bahrain, name: "البحرين",                  bbox: [50.3, 25.5, 50.9, 26.4]}
  - {id: kuwait,  name: "الكويت",                   bbox: [46.5, 28.5, 48.5, 30.1]}
  - {id: oman,    name: "عُمان",                     bbox: [51.9, 16.6, 60.0, 26.5]}
  - {id: iraq,    name: "العراق",                   bbox: [38.7, 29.0, 48.8, 37.4]}
  - {id: red_sea, name: "البحر الأحمر وباب المندب", bbox: [32.0, 12.0, 44.5, 30.0]}

# متى يرسل تنبيهاً إلى تلغرام
alerts:
  min_verdict: "مرجّح"   # أقل حكم يستحق التنبيه: مؤكد / مرجّح / يحتاج تأكيداً
  at_facility_km: 2        # حريق داخل منشأة طاقة أو على بعد هذه المسافة منها = مهم
  near_facility_km: 10     # وعلى بعد أكبر حتى هذه المسافة: مهم فقط إذا كان قوياً (السطر التالي)
  near_facility_min_mw: 50
  big_fire_mw: 50          # أي حريق بهذه الشدة (ميغاواط) مهم حتى لو بعيداً عن المنشآت
  max_age_hours: 8         # رصدة أقدم من هذا تظهر في التطبيق ولا تُرسل كخبر
  intensity_ratio: 1.5     # تحديث عند زيادة القمة 50% على الأقل منذ آخر تنبيه
  intensity_add_mw: 1      # وبزيادة ميغاواط واحد على الأقل حتى لا تضيع زيادات الحرائق البحرية الصغيرة
  intensity_interval_min: 30  # أقل فاصل بين التنبيهات المتتالية للشدة
  intensity_max_age_hours: 24  # تحديث للحوادث المرسلة فقط؛ القياسات الأقدم من 8 ساعات تُوسم كتحديث متأخر
  # الحرائق الكبيرة البعيدة عن المنشآت تُعدّ مهمة فقط في هذه الدول
  focus_countries: [العراق, السعودية, الإمارات, قطر, البحرين, الكويت, عمان, عُمان, إيران, اليمن]
                           # الحرائق في البحر وفي الموانئ مهمة دائماً

# ذاكرة الحرارة المعتادة (شعلات الغاز والمصانع)
memory:
  persistent_min_days: 2   # مكان ظهرت فيه حرارة يومين أو أكثر خلال الشهر = معتاد
  window_days: 30
  unusual_ratio: 5         # شعلة منشأة معتادة صارت أقوى من عادتها 5 أضعاف (وبزيادة 25 ميغاواط على الأقل)
  unusual_add_mw: 25       # تصنّف حرارة غير معتادة وتخضع لشروط التأكيد قبل التنبيه

clip:
  frames: 8
  half_size_km: 20   # مقرّب على الحريق: الصورة تغطي 40 كم
  hud_title: "ALFAQAAR FIRMS"   # اسم القناة في أعلى يسار المقطع (بجانب الشعار)
  format: mp4

# استرجاع محدود للرصد الفائت. لا يرسل الحوادث المسترجعة كأخبار جديدة إلى تلغرام.
recovery:
  enabled: true
  budget_s: 15
  max_images_per_run: 2
  auto_targets: true
  targets:
    # نافذة راجعناها في منتج الحرائق الرسمي؛ يعيد تحميل الأدلة ولا ينشئ رصداً من الوصف.
    - {id: abqaiq_20261108, lat: 25.9239, lon: 49.6935, start: "2026-11-08T01:20:00Z", end: "2026-11-08T02:40:00Z", layer: mtg_frp}

# تصحيح هادئ لسجل راجعناه من ملفات ناسا الأصلية، دون تنبيهات جديدة أو تعديل رسائل سابقة.
repairs:
  enabled: true
  cases: [hormuz_20261108]

# كاشف رصد الخاص: بقع حرارة جديدة في البحر كل 10 دقائق من صور Meteosat-12
seawatch:
  enabled: true     # يعمل الآن على مضيق هرمز وبحر عُمان وجنوب الخليج (اختُبر على ليلة 1 نوفمبر)
  platform_km: 3    # نستبعد الحرارة الملاصقة للمنصة، لا بقعة مستقلة تبعد عنها نحو 9 كم
  look_back: true   # حين ترصد ناسا حريقاً في البحر يبحث في صور Meteosat-12 عن وقت بدايته الحقيقي
  sparkle_min_days: 3  # رصدة قديمة واحدة لا تجعل الموقع شعلة معتادة
  alerts: true      # تنبيه بعد تكرار الرصد واجتياز فحوص الغيوم والمنصات والحرارة السابقة
  daytime:
    enabled: true  # فحص نهاري تجريبي مع حجب لمعان الشمس وانعكاساتها وتغيّر الغيوم
    ref_minutes: [30, 60]  # يلزم المرجعان وصورتان مستقلتان للبقعة
    # تظهر البقعة للمراجعة؛ لا تُرسل إلى تلغرام حتى تؤكدها ناسا بثقة مناسبة أو منتج حرائق رسمي
    # الصور المعروضة لا توفر حرارة معايرة: لا نحول سطوعها إلى ميغاواط أو درجات كلفن
