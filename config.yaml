# ============================================================
#  رصد: الإعدادات
#  المفاتيح السرية (تلغرام وناسا) توضع في GitHub Secrets لا هنا.
# ============================================================

app_name: "رصد"
app_url: ""          # رابط التطبيق بعد نشره، يضاف تلقائياً في GitHub
watermark: ""        # العلامة المائية على المقاطع (اسم قناتك مثلاً)

local_time:
  offset_hours: 3
  name: "بغداد"

# المناطق المراقبة. لإيقاف منطقة اكتب enabled: false
# bbox = [غرب, جنوب, شرق, شمال] بالدرجات
regions:
  - {id: hormuz,  name: "مضيق هرمز",                bbox: [55.4, 25.3, 57.6, 27.3]}
  - {id: gulf,    name: "الخليج العربي",            bbox: [47.8, 23.5, 56.6, 30.5]}
  - {id: saudi,   name: "السعودية",                 bbox: [34.4, 16.3, 55.7, 32.2]}
  - {id: uae,     name: "الإمارات",                 bbox: [51.5, 22.6, 56.4, 26.1]}
  - {id: qatar,   name: "قطر",                      bbox: [50.7, 24.4, 51.7, 26.2]}
  - {id: bahrain, name: "البحرين",                  bbox: [50.3, 25.5, 50.9, 26.4]}
  - {id: kuwait,  name: "الكويت",                   bbox: [46.5, 28.5, 48.5, 30.1]}
  - {id: oman,    name: "عُمان",                     bbox: [51.9, 16.6, 60.0, 26.5]}
  - {id: iraq,    name: "العراق",                   bbox: [38.7, 29.0, 48.8, 37.4]}
  - {id: red_sea, name: "البحر الأحمر وباب المندب", bbox: [32.0, 12.0, 44.5, 30.0]}

# متى يرسل تنبيهاً إلى تلغرام
alerts:
  min_verdict: "مرجّح"   # أقل حكم يستحق التنبيه: مؤكد / مرجّح / يحتاج تأكيداً
  at_facility_km: 2        # حريق داخل منشأة طاقة أو على بعد هذه المسافة منها = مهم
  near_facility_km: 10     # وعلى بعد أكبر حتى هذه المسافة: مهم فقط إذا كان قوياً (السطر التالي)
  near_facility_min_mw: 50
  big_fire_mw: 50          # أي حريق بهذه الشدة (ميغاواط) مهم حتى لو بعيداً عن المنشآت
  max_age_hours: 8         # رصدة أقدم من هذا تظهر في التطبيق ولا تُرسل كخبر
  # الحرائق الكبيرة البعيدة عن المنشآت تُعدّ مهمة فقط في هذه الدول
  focus_countries: [العراق, السعودية, الإمارات, قطر, البحرين, الكويت, عمان, عُمان, إيران, اليمن]
                           # الحرائق في البحر وفي الموانئ مهمة دائماً

# ذاكرة الحرارة المعتادة (شعلات الغاز والمصانع)
memory:
  persistent_min_days: 2   # مكان ظهرت فيه حرارة يومين أو أكثر خلال الشهر = معتاد
  window_days: 30
  unusual_ratio: 5         # شعلة منشأة معتادة صارت أقوى من عادتها 5 أضعاف (وبزيادة 100 ميغاواط على الأقل)
  unusual_add_mw: 100      # = حرارة غير معتادة. تقلّب الشعلات العادي أقل من ذلك

clip:
  frames: 8
  half_size_km: 20   # مقرّب على الحريق: الصورة تغطي 40 كم
  format: mp4

# كاشف رصد الخاص: كل 10 دقائق يبحث في صور Meteosat-12 عن بقعة حرارة جديدة في البحر ليلاً
# (حرائق السفن الصغيرة التي لا يسجّلها منتج الحرائق الرسمي)
seawatch:
  enabled: false    # المسح الكامل كل 10 دقائق: متوقف حتى تنتهي معايرته (أعطى بقعاً كاذبة في الخليج)
  look_back: true   # لكن حين ترصد ناسا حريقاً في البحر يبحث في صور Meteosat-12 عن وقت بدايته الحقيقي
  alerts: false
