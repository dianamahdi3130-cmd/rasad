name: رصد - مراقبة متواصلة

# One job checks every ~2.5 minutes for almost six hours, then the next run (already queued by the
# timer at cron-job.org or by this schedule) takes over. New code on main ends the loop early so
# the queued run starts with it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["web/**", "rasad/**", "scripts/**", "config.yaml", "requirements.txt", ".github/workflows/rasad.yml"]

permissions:
  contents: write

concurrency:
  group: rasad
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Keep the Arabic font for the clips
        uses: actions/cache@v4
        with:
          path: fonts
          key: fonts-noto-arabic-v1

      - name: Arabic font for the clips (first time only)
        run: |
          mkdir -p fonts
          [ -s fonts/NotoSansArabic.ttf ] || curl -sSL --retry 3 -o fonts/NotoSansArabic.ttf \
            "https://github.com/google/fonts/raw/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf" || true

      # The private app on Cloudflare (see worker/): once it answers, the data and clips go there
      # only, the memory is stored sealed and nothing readable is left on GitHub.
      - name: Private app ready?
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            sub=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" \
              | python3 -c "import sys,json; print((json.load(sys.stdin).get('result') or {}).get('subdomain') or '')" || true)
            if [ -n "$sub" ]; then
              url="https://firms.$sub.workers.dev"
              echo "::add-mask::$sub"
              if [ "$(curl -sS --max-time 20 "$url/api/ping" || true)" = "ok" ]; then
                key=$(printf '%s' "$CF_TOKEN:ingest" | sha256sum | cut -c1-64)
                skey=$(printf '%s' "$CF_TOKEN:state" | sha256sum | cut -c1-64)
                echo "::add-mask::$key"
                echo "::add-mask::$skey"
                {
                  echo "RASAD_CLOUD_URL=$url"
                  echo "RASAD_INGEST_KEY=$key"
                  echo "RASAD_STATE_KEY=$skey"
                  echo "RASAD_APP_URL=$url/"
                  echo "RASAD_QUIET=1"
                } >> "$GITHUB_ENV"
                echo "private app: on"
                exit 0
              fi
            fi
          fi
          echo "RASAD_APP_URL=$PAGES_URL" >> "$GITHUB_ENV"
          echo "private app: not set up yet (public site as before)"

      - name: Bring back the memory and the app
        run: bash scripts/branches.sh restore

      - name: Watch the satellites (a check every ~2.5 minutes)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RASAD_EVERY_SECONDS: "150"
          RASAD_LOOP_MINUTES: "335"
          RASAD_GEO_BUDGET: "45"
        run: bash scripts/loop.sh

      - name: Save the memory and publish the app
        if: always()
        run: bash scripts/branches.sh save
