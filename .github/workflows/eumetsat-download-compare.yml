name: رصد - مقارنة تنزيل EUMETSAT

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tools/eumetsat_download_compare.py", ".github/workflows/eumetsat-download-compare.yml"]

permissions:
  contents: read

concurrency:
  group: eumetsat-access
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: pip install --disable-pip-version-check requests==2.34.2
      - name: Compare bounded reads of the same product
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
        run: python -m tools.eumetsat_download_compare
      - name: Save the comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eumetsat-download-comparison
          path: eumetsat-compare/report.json
          if-no-files-found: ignore
          retention-days: 3
